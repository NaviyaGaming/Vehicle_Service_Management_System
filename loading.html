<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torque Point — Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f1c;
            --accent: #ffb800;
            --accent-glow: rgba(255, 184, 0, 0.4);
            --accent-2: #00d4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(ellipse at 70% 50%, #14213a 0%, #0a0f1c 60%, #050811 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        /* Subtle background glow matching the main site */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 100%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 0%, rgba(255, 184, 0, 0.05) 0%, transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        .loader-logo-wrap {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-right-color: var(--accent);
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .loader-ring.secondary {
            inset: 8px;
            border: 3px solid transparent;
            border-bottom-color: var(--accent-2);
            border-left-color: var(--accent-2);
            animation: spinReverse 1.5s linear infinite;
            opacity: 0.7;
        }

        .loader-bolt {
            font-size: 28px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px var(--accent-glow));
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loader-brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-top: 10px;
            z-index: 2;
        }

        .loader-bar-container {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            overflow: hidden;
            margin-top: 10px;
            z-index: 2;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 100px;
            transition: width 0.2s ease;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.85); opacity: 0.8; }
        }

        /* Fade out effect before redirect */
        body.fade-out {
            opacity: 1;
            animation: fadeOut 0.5s ease forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="loader-logo-wrap">
        <div class="loader-ring"></div>
        <div class="loader-ring secondary"></div>
        <i class="fa-solid fa-bolt loader-bolt"></i>
    </div>
    <div class="loader-brand">TORQUE POINT</div>
    <div class="loader-bar-container">
        <div class="loader-bar" id="loader-bar"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const loaderBar = document.getElementById('loader-bar');
            let progress = 0;
            
            const interval = setInterval(() => {
                // Simulate loading progress
                progress += Math.random() * 15 + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    // Fade out and redirect
                    setTimeout(() => {
                        document.body.classList.add('fade-out');
                        setTimeout(() => {
                            window.location.href = 'index.html'; // Redirect to main login page
                        }, 500);
                    }, 300);
                }
                loaderBar.style.width = progress + '%';
            }, 150);
        });
    </script>
</body>
</html>
